<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box annotator for Commons images</title>
<link rel="icon" href="favicon.svg">
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 1rem auto; max-width: 60rem; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  p { margin: .25rem 0 1rem; color: #555; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] { flex: 1; padding: .4rem .6rem; font: inherit; }
  button { padding: .4rem .9rem; font: inherit; cursor: pointer; }
  /* No padding or border here: the rectangle is measured on the image itself. */
  #stage { position: relative; display: inline-block; line-height: 0; touch-action: none; cursor: crosshair; user-select: none; }
  #img { display: block; max-width: 100%; height: auto; }
  #box { position: absolute; border: 2px solid #e00; background: rgba(255, 0, 0, .15); pointer-events: none; display: none; box-sizing: border-box; }
  #out { display: flex; gap: .5rem; align-items: center; margin-top: 1rem; }
  #value { font: 1rem ui-monospace, monospace; padding: .3rem .5rem; background: #f3f3f3; min-width: 20rem; }
  #msg { color: #b00; min-height: 1.5rem; }
</style>
</head>
<body>
<h1>Box annotator for Commons images</h1>
<p>Enter a Commons file name, then drag a rectangle on the image. The value is the
<code>relative position within image</code> (<code>P2677</code>) qualifier for a <code>depicts</code> statement.</p>

<form id="form">
  <input id="name" type="text" aria-label="Commons file name"
         value="Zürich (Schweiz), Bahnhof -- 2011 -- 1386.jpg">
  <button type="submit">Load</button>
</form>
<div id="msg" role="status"></div>

<div id="stage">
  <img id="img" alt="" draggable="false">
  <div id="box"></div>
</div>

<div id="out">
  <code id="value">Drag on the image</code>
  <button id="copy" type="button" disabled>Copy</button>
</div>

<script>
const $ = (id) => document.getElementById(id)
const img = $('img'), box = $('box'), stage = $('stage')
const msg = $('msg'), value = $('value'), copy = $('copy')

let start = null // pointer start, in percent of the image

// Percent position of a pointer event on the image, measured now and clamped to 0..100.
function pointInImage(e) {
  const r = img.getBoundingClientRect()
  const clamp = (v) => Math.min(100, Math.max(0, v))
  return {
    x: clamp(((e.clientX - r.left) / r.width) * 100),
    y: clamp(((e.clientY - r.top) / r.height) * 100),
  }
}

function rectFrom(a, b) {
  return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) }
}

function draw(r) {
  box.style.display = 'block'
  box.style.left = r.x + '%'
  box.style.top = r.y + '%'
  box.style.width = r.w + '%'
  box.style.height = r.h + '%'
}

const fmt = (n) => n.toFixed(2)
const pct = (r) => `pct:${fmt(r.x)},${fmt(r.y)},${fmt(r.w)},${fmt(r.h)}`

stage.addEventListener('pointerdown', (e) => {
  if (!img.complete || !img.naturalWidth) return
  e.preventDefault()
  stage.setPointerCapture(e.pointerId)
  start = pointInImage(e)
  draw({ ...start, w: 0, h: 0 })
})

stage.addEventListener('pointermove', (e) => {
  if (!start) return
  draw(rectFrom(start, pointInImage(e)))
})

stage.addEventListener('pointerup', (e) => {
  if (!start) return
  const r = rectFrom(start, pointInImage(e))
  start = null
  if (r.w === 0 || r.h === 0) { box.style.display = 'none'; return }
  draw(r)
  value.textContent = pct(r)
  copy.disabled = false
})

copy.addEventListener('click', async () => {
  await navigator.clipboard.writeText(value.textContent)
  copy.textContent = 'Copied'
  setTimeout(() => { copy.textContent = 'Copy' }, 1200)
})

function load() {
  // "File:" prefix and spaces are accepted; Special:FilePath wants underscores.
  const name = $('name').value.trim().replace(/^(File|Datei|Fichier):/i, '').replace(/ /g, '_')
  if (!name) return
  msg.textContent = ''
  box.style.display = 'none'
  value.textContent = 'Drag on the image'
  copy.disabled = true
  // Always pass a width: a TIFF original cannot be shown by most browsers.
  img.src = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(name) + '?width=1600'
}

img.addEventListener('error', () => { msg.textContent = 'Could not load this file. Check the name.' })
$('form').addEventListener('submit', (e) => { e.preventDefault(); load() })
load()
</script>
</body>
</html>
